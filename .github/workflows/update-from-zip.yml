name: Update app from ZIP

on:
  push:
    paths:
      - "*.zip"
      - "**/*.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find uploaded ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=$(find . \
            -type f \
            -iname "*.zip" \
            -not -path "./.git/*" \
            -not -path "./.github/*" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          ZIP_FILE="${ZIP_FILE#./}"

          echo "ZIP found: $ZIP_FILE"
          echo "path=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Prepare extraction directory
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .zip_extract
          mkdir -p .zip_extract

      - name: Extract ZIP
        env:
          ZIP_FILE: ${{ steps.zip.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import os
          import zipfile
          from pathlib import Path

          zip_path = Path(os.environ["ZIP_FILE"]).resolve()
          destination = Path(".zip_extract").resolve()

          print(f"ZIP: {zip_path}")
          print(f"Destination: {destination}")

          with zipfile.ZipFile(zip_path, "r") as archive:

              members = archive.infolist()

              if not members:
                  raise RuntimeError("ZIP file is empty.")

              print("ZIP contents:")

              for member in members:
                  print(" -", member.filename)

                  target = (destination / member.filename).resolve()

                  # Zip Slip protection
                  try:
                      target.relative_to(destination)
                  except ValueError:
                      raise RuntimeError(
                          f"Unsafe ZIP entry detected: {member.filename}"
                      )

              archive.extractall(destination)

          print("ZIP extraction completed.")
          PY

      - name: Verify extracted files
        shell: bash
        run: |
          set -euo pipefail

          echo "========== Extracted files =========="

          find .zip_extract \
            -maxdepth 5 \
            -type f \
            -print \
            | sort

          FILE_COUNT=$(find .zip_extract -type f | wc -l)

          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "ERROR: ZIP extraction produced no files."
            exit 1
          fi

          echo
          echo "Extracted $FILE_COUNT file(s)."

      - name: Detect application root
        id: root
        shell: bash
        run: |
          set -euo pipefail

          ROOT=".zip_extract"

          # If the ZIP contains exactly one directory and nothing else,
          # use that directory as the application root.
          mapfile -t ITEMS < <(
            find .zip_extract \
              -mindepth 1 \
              -maxdepth 1 \
              -printf "%y %p\n" \
              | sort
          )

          if [ "${#ITEMS[@]}" -eq 1 ]; then
            ITEM_TYPE="${ITEMS[0]:0:1}"
            ITEM_PATH="${ITEMS[0]:2}"

            if [ "$ITEM_TYPE" = "d" ]; then
              ROOT="$ITEM_PATH"
              echo "Detected ZIP root directory: $ROOT"
            else
              echo "ZIP contains files directly at root."
            fi
          else
            echo "ZIP contains multiple root entries."
          fi

          if [ ! -d "$ROOT" ]; then
            echo "ERROR: Application root does not exist: $ROOT"
            exit 1
          fi

          echo "Application root: $ROOT"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Validate application
        env:
          APP_ROOT: ${{ steps.root.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          echo "========== Application contents =========="

          find "$APP_ROOT" \
            -maxdepth 5 \
            -print \
            | sort

          if [ -f "$APP_ROOT/main.py" ]; then
            echo
            echo "main.py found."
          else
            echo
            echo "WARNING: main.py was not found."
          fi

          if [ -f "$APP_ROOT/requirements.txt" ]; then
            echo "requirements.txt found."
          else
            echo "WARNING: requirements.txt was not found."
          fi

      - name: Remove old application
        shell: bash
        run: |
          set -euo pipefail

          echo "Removing old application files..."

          find . \
            -mindepth 1 \
            -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            ! -name ".gitignore" \
            ! -name ".gitattributes" \
            -exec rm -rf {} +

          echo "Old application removed."

      - name: Install new application
        env:
          APP_ROOT: ${{ steps.root.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Installing application from:"
          echo "$APP_ROOT"

          # The extracted directory is still present.
          # Copy everything, including hidden files.
          cp -a "$APP_ROOT"/. .

          echo "New application installed."

      - name: Clean temporary files
        env:
          ZIP_FILE: ${{ steps.zip.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .zip_extract

          if [ -n "$ZIP_FILE" ] && [ -f "$ZIP_FILE" ]; then
            rm -f "$ZIP_FILE"
          fi

          # Remove any other uploaded ZIP files.
          find . \
            -type f \
            -iname "*.zip" \
            -not -path "./.git/*" \
            -not -path "./.github/*" \
            -delete

          echo "Temporary files removed."

      - name: Verify final repository
        shell: bash
        run: |
          set -euo pipefail

          echo "========== Final repository =========="

          find . \
            -maxdepth 5 \
            -not -path "./.git/*" \
            -not -path "./.github/*" \
            -print \
            | sort

          echo
          echo "========== Python syntax check =========="

          if [ -f "main.py" ]; then
            python3 -m py_compile main.py
            echo "main.py syntax: OK"
          fi

          echo
          echo "========== Required files =========="

          test -f "main.py"
          test -f "requirements.txt"
          test -f "templates/index.html"
          test -f "static/main.js"
          test -f "static/style.css"

          echo "Required files: OK"

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "Update application from uploaded ZIP"

      - name: Push changes
        shell: bash
        run: |
          set -euo pipefail

          git push origin HEAD:${GITHUB_REF_NAME}

          echo "Changes pushed successfully."
