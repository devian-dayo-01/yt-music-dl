<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#07080b">
    <title>Wave</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
    <header class="topbar">
        <div class="logo">WAVE<span>•</span></div>
        <div class="status" id="instanceCount">network</div>
    </header>

    <main class="shell">
        <section class="hero">
            <h1>Music, instantly.</h1>
            <p>検索して、そのまま軽く再生。高速な配信経路を自動で選択します。</p>

            <div class="search">
                <input id="searchInput" type="search" placeholder="曲名、アーティスト、アルバム…" autocomplete="off">
                <button id="searchBtn" onclick="search()">検索</button>
            </div>
        </section>

        <div class="section-title">Search results</div>
        <section id="results" class="results"></section>

        <div class="section-title">Queue</div>
        <section id="queue" class="queue"></section>
    </main>

    <section class="player">
        <div class="player-inner">
            <div class="now">
                <img id="nowArt" src="https://i.ytimg.com/vi/0/hqdefault.jpg" alt="">
                <div>
                    <div class="now-title" id="nowTitle">何も再生していません</div>
                    <div class="now-artist" id="nowArtist">曲を選択してください</div>
                    <div class="source" id="playerStatus">Ready</div>
                    <div class="source" id="playerSource"></div>
                </div>
            </div>

            <div>
                <div class="controls">
                    <button class="control" id="prevBtn" aria-label="前へ">↶</button>
                    <button class="control main" id="playBtn" aria-label="再生">▶</button>
                    <button class="control" id="nextBtn" aria-label="次へ">↷</button>
                </div>
                <div class="timeline">
                    <span id="currentTime">0:00</span>
                    <input id="seek" type="range" min="0" max="1000" value="0">
                    <span id="duration">0:00</span>
                </div>
            </div>

            <div class="player-extra">
                <span>🔊</span>
                <input id="volume" type="range" min="0" max="1" step=".01" value=".9">
            </div>
        </div>
    </section>
</div>

<div id="toast" class="toast"></div>
<script src="/static/main.js"></script>
</body>
</html>
